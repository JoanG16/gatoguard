<script>
const $ = (sel) => document.querySelector(sel);
let eventosCache = [];

function iconoZona(nombre) {
  const n = (nombre || '').toLowerCase();
  if (n.includes('comedor') || n.includes('cocina')) return 'restaurant';
  if (n.includes('arenero') || n.includes('baño')) return 'cleaning_services';
  if (n.includes('cama') || n.includes('dormitorio')) return 'bed';
  if (n.includes('escritorio') || n.includes('oficina')) return 'chair';
  if (n.includes('sala') || n.includes('living')) return 'weekend';
  return 'location_on';
}

function horaCorta(fechaISO) {
  return new Date(fechaISO).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
}

function duracionEntre(msInicio, msFin) {
  const min = Math.round((msFin - msInicio) / 60000);
  if (min < 1) return 'menos de 1 min';
  if (min < 60) return `${min} min`;
  const horas = Math.floor(min / 60);
  return `${horas}h ${min % 60}min`;
}

function esMismoDiaQue(fechaISO, referencia) {
  return fechaLocalClave(fechaISO) === fechaLocalClave(referencia);
}

function fechaLocalClave(valor) {
  const partes = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/Bogota',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
  }).formatToParts(valor instanceof Date ? valor : new Date(valor));
  const obtener = tipo => partes.find(parte => parte.type === tipo).value;
  return `${obtener('year')}-${obtener('month')}-${obtener('day')}`;
}

function finDelDia(fechaISO) {
  const fecha = new Date(fechaISO);
  fecha.setHours(23, 59, 59, 999);
  return fecha.getTime();
}

function renderTimeline() {
  const filtro = $('#filtro-fecha').value;
  const fechaElegida = $('#fecha-especifica').value;
  const cont = $('#timeline-container');

  let eventos = eventosCache;
  if (fechaElegida) {
    eventos = eventos.filter(e => fechaLocalClave(e.cambiado_en) === fechaElegida);
  } else if (filtro === 'hoy') {
    eventos = eventos.filter(e => esMismoDiaQue(e.cambiado_en, new Date()));
  } else if (filtro === 'ayer') {
    const ayer = new Date();
    ayer.setDate(ayer.getDate() - 1);
    eventos = eventos.filter(e => esMismoDiaQue(e.cambiado_en, ayer));
  }

  const segmentoVigenteDeAyer = filtro === 'hoy' && !fechaElegida && eventos.length === 0 && eventosCache.length > 0;
  if (segmentoVigenteDeAyer) {
    eventos = [eventosCache[0]];
  }

  if (eventos.length === 0) {
    cont.innerHTML = '<p class="text-on-surface-variant font-body-md">No hay movimientos registrados en este rango.</p>';
    return;
  }

  // eventosCache viene ordenado del más reciente al más viejo (igual que /api/historial).
  cont.innerHTML = eventos.map((e, i) => {
    const inicio = new Date(e.cambiado_en).getTime();
    const siguiente = eventosCache
      .map(evento => new Date(evento.cambiado_en).getTime())
      .filter(momento => momento > inicio)
      .sort((a, b) => a - b)[0];
    const esHoy = esMismoDiaQue(e.cambiado_en, new Date());
    const esActual = !fechaElegida && filtro === 'hoy' && i === 0 && (esHoy || segmentoVigenteDeAyer);
    const finSegmento = esActual
      ? Date.now()
      : Math.min(siguiente || finDelDia(e.cambiado_en), finDelDia(e.cambiado_en));
    const duracion = duracionEntre(new Date(e.cambiado_en).getTime(), finSegmento);

    return `
      <article class="relative flex gap-md items-start">
        <div class="z-10 flex-shrink-0 mt-1">
          <div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center border-4 border-surface shadow-sm ${esActual ? 'text-primary' : 'text-secondary'}">
            <span class="material-symbols-outlined">${iconoZona(e.nombre_zona)}</span>
          </div>
        </div>
        <div class="flex-grow bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-surface-variant flex flex-col gap-unit">
          <span class="text-label-lg font-label-lg text-on-surface-variant">${horaCorta(e.cambiado_en)}${esActual ? ' · en curso' : ''}</span>
          <h3 class="text-headline-sm font-headline-sm text-on-surface">${e.nombre_zona}</h3>
          <span class="inline-block px-3 py-1 bg-surface-container-low text-on-surface font-label-md rounded-full w-max mt-unit">${duracion}</span>
        </div>
      </article>
    `;
  }).join('');
}

async function cargarHistorial() {
  try {
    const res = await fetch('/api/historial?limit=200', { cache: 'no-store' });
    eventosCache = await res.json();
    renderTimeline();
  } catch (err) {
    console.error('Error /api/historial', err);
    $('#timeline-container').innerHTML = '<p class="text-error font-body-md">No se pudo cargar el historial.</p>';
  }
}

$('#filtro-fecha').addEventListener('change', renderTimeline);
$('#fecha-especifica').addEventListener('change', () => {
  $('#filtro-fecha').value = 'todos';
  renderTimeline();
});
cargarHistorial();
</script>
