<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#8f4e00">
  <title>GatoGuard - Perfil</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&family=Lexend:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{visibility:hidden;font-family:Arial,sans-serif}body.ui-ready{visibility:visible}</style>
  <script>tailwind.config={theme:{extend:{colors:{surface:"#f3fbfd",primary:"#8f4e00","primary-container":"#ff9f43","on-surface":"#151d1f","on-surface-variant":"#544437","surface-container-low":"#edf5f7"},fontFamily:{headline:["Lexend"],body:["Quicksand"]}}}}</script>
</head>
<body class="min-h-screen bg-surface pb-24 text-on-surface font-body">
  <header class="fixed top-0 z-50 flex w-full items-center justify-between bg-surface px-5 py-4 shadow-sm"><a href="index.html" class="text-primary"><span class="material-symbols-outlined">arrow_back</span></a><h1 class="font-headline text-xl font-bold text-primary">Perfil</h1><span class="w-6"></span></header>
  <main class="mx-auto max-w-2xl space-y-5 px-5 pt-24">
    <section class="flex items-center gap-4 rounded-2xl bg-white p-5 shadow-sm"><div class="flex h-20 w-20 items-center justify-center overflow-hidden rounded-full bg-primary-container/40"><img id="foto" class="hidden h-full w-full object-cover" alt="Foto de Michi"><span id="icono-foto" class="material-symbols-outlined text-5xl text-primary">pets</span></div><div><h2 id="nombre-titulo" class="font-headline text-3xl font-semibold">Michi</h2><p id="mac" class="text-sm text-on-surface-variant">Cargando dispositivo...</p><p id="zona" class="mt-1 text-sm text-on-surface-variant"></p></div></section>
    <section class="rounded-2xl bg-white p-5 shadow-sm"><h2 class="font-headline text-xl font-semibold">Datos de Michi</h2><p class="mb-4 mt-1 text-sm text-on-surface-variant">Actualiza únicamente la información básica de tu gato.</p><form id="config-gato" class="grid gap-4"><label class="text-sm">Nombre<input name="nombre" required class="mt-1 w-full rounded-xl border-surface-variant"></label><label class="text-sm">Edad (años)<input name="edad_anios" type="number" min="0" step="0.1" class="mt-1 w-full rounded-xl border-surface-variant"></label><label class="text-sm">Peso (kg)<input name="peso_kg" type="number" min="0" step="0.1" class="mt-1 w-full rounded-xl border-surface-variant"></label><label class="text-sm">Foto (URL)<input name="foto_url" type="url" class="mt-1 w-full rounded-xl border-surface-variant"></label><div class="flex items-center gap-3"><button class="rounded-xl bg-primary px-4 py-2 text-white">Guardar</button><span id="mensaje" class="text-sm text-secondary"></span></div></form></section>
    <section class="rounded-2xl bg-white p-5 shadow-sm"><div class="flex items-center justify-between gap-3"><div><h2 class="font-headline text-xl font-semibold">Dispositivos</h2><p class="mt-1 text-sm text-on-surface-variant">Gestiona gateways M5Stack y beacons.</p></div><a href="dispositivos.html" class="rounded-xl bg-primary px-4 py-2 text-white">Abrir</a></div></section>
  </main>
<nav class="fixed bottom-0 left-0 z-50 flex w-full justify-around rounded-t-xl bg-surface px-2 py-2 shadow-[0px_-4px_20px_rgba(0,0,0,0.05)] md:hidden"><a class="flex flex-col items-center p-2 text-on-surface-variant" href="index.html"><span class="material-symbols-outlined">home</span><span class="text-xs">Home</span></a><a class="flex flex-col items-center p-2 text-on-surface-variant" href="estadisticas.html"><span class="material-symbols-outlined">analytics</span><span class="text-xs">Estadísticas</span></a><a class="flex flex-col items-center p-2 text-on-surface-variant" href="calendario.html"><span class="material-symbols-outlined">calendar_month</span><span class="text-xs">Agenda</span></a><a class="flex flex-col items-center p-2 text-on-surface-variant" href="dispositivos.html"><span class="material-symbols-outlined">wifi_tethering</span><span class="text-xs">Dispositivos</span></a><a class="flex flex-col items-center rounded-full bg-primary-container px-3 py-1" href="perfil.html"><span class="material-symbols-outlined">pets</span><span class="text-xs">Perfil</span></a></nav>
  <script>
    const $=s=>document.querySelector(s); const form=$('#config-gato');
    async function cargar(){const [perfilRes,configRes]=await Promise.all([fetch('/api/perfil?t='+Date.now(),{cache:'no-store'}),fetch('/api/configuracion-gato?t='+Date.now(),{cache:'no-store'})]);const perfil=await perfilRes.json(),config=await configRes.json();$('#nombre-titulo').textContent=perfil.nombre;$('#mac').textContent=`Beacon ${perfil.mac}`;$('#zona').textContent=perfil.zona_actual?`Última zona: ${perfil.zona_actual}`:'Sin ubicación confirmada';for(const campo of form.elements){if(campo.name&&config[campo.name]!==null&&config[campo.name]!==undefined)campo.value=config[campo.name]}if(config.foto_url){$('#foto').src=config.foto_url;$('#foto').classList.remove('hidden');$('#icono-foto').classList.add('hidden')}} cargar().catch(console.error);
    form.addEventListener('submit',async e=>{e.preventDefault();const datos=Object.fromEntries(new FormData(form).entries());const res=await fetch('/api/configuracion-gato',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(datos)});$('#mensaje').textContent=res.ok?'Guardado.':'No se pudo guardar.';if(res.ok)$('#nombre-titulo').textContent=datos.nombre});
  </script><script>window.addEventListener('load',()=>document.body.classList.add('ui-ready'));setTimeout(()=>document.body.classList.add('ui-ready'),1500)</script>
<script src="/pwa.js"></script>
</body>
</html>
